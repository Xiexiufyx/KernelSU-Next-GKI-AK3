name: KernelSU Next v3.4.2 SUSFS GKI AnyKernel3

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Build one smoke target or all 207 SUSFS-supported Normal GKI targets
        type: choice
        options: [smoke, full]
        default: smoke
        required: true
      family:
        description: Family for the smoke build (ignored for full)
        type: choice
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
        default: android16-6.12
        required: true
      patch_level:
        description: Exact YYYY-MM or lts entry for smoke (ignored for full)
        type: string
        default: '2026-09'
        required: true
      smoke_run_id:
        description: Full builds require the successful, published smoke run ID from this exact commit
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: ksun-next-v3.4.2-susfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      expected_count: ${{ steps.validate.outputs.expected_count }}
      susfs_commits: ${{ steps.validate.outputs.susfs_commits }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate scope, target, and prior smoke release
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
          FAMILY: ${{ inputs.family }}
          PATCH_LEVEL: ${{ inputs.patch_level }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
        run: |
          set -euo pipefail
          supported_families=(android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12)
          supported_configs=()
          for supported_family in "${supported_families[@]}"; do
            supported_configs+=(".github/config/${supported_family}.json")
          done
          if [ "$SCOPE" = smoke ]; then
            if [[ ! " ${supported_families[*]} " == *" ${FAMILY} "* ]]; then
              echo "No verified SUSFS branch for ${FAMILY}; android17-6.18 is excluded." >&2
              exit 1
            fi
            config=".github/config/${FAMILY}.json"
            test -f "$config"
            count="$(jq --arg date "$PATCH_LEVEL" '[.include[] | select(.date == $date)] | length' "$config")"
            if [ "$count" -ne 1 ]; then
              echo "Smoke requires exactly one configured Normal target: ${FAMILY} ${PATCH_LEVEL} (found ${count})." >&2
              exit 1
            fi
          elif [ "$SCOPE" = full ]; then
            if ! [[ "$SMOKE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo 'Full builds require a successful smoke_run_id.' >&2
              exit 1
            fi
            smoke="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SMOKE_RUN_ID}")"
            jq -e --arg sha "$GITHUB_SHA" \
              '.conclusion == "success" and .event == "workflow_dispatch" and
               .path == ".github/workflows/build-ksun-next-3.4.2-susfs.yml" and .head_sha == $sha' \
              <<< "$smoke" >/dev/null
            smoke_release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -ers --arg tag "ksun-next-v3.4.2-susfs-smoke-${SMOKE_RUN_ID}" --arg sha "$GITHUB_SHA" '
                [.[][] | select(.tag_name == $tag and .draft == true and .target_commitish == $sha)] |
                if length == 1 then .[0].id else error("Missing or mismatched SUSFS smoke draft") end')"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${smoke_release_id}/assets?per_page=100" |
              jq -e 'length == 5 and
                all(.[]; .state == "uploaded" and .size > 0 and ((.digest // "") | startswith("sha256:"))) and
                ([.[] | select(.name | endswith("-KSUN-v3.4.2-SUSFS.zip"))] | length == 1) and
                ([.[] | select(.name == "SHA256SUMS.txt" or
                  .name == "MANAGER-SHA256SUMS.txt" or
                  .name == "KernelSU_Next_v3.4.2_33355-release.apk" or
                  .name == "KernelSU_Next_v3.4.2-spoofed_33355-release.apk")] | length == 4)' >/dev/null
            count="$(jq -s '[.[] | .include | length] | add' "${supported_configs[@]}")"
            if [ "$count" -ne 207 ]; then
              echo "Expected 207 SUSFS-supported configuration rows, found ${count}; review matrix before building." >&2
              exit 1
            fi
          else
            echo "Unsupported scope: $SCOPE" >&2
            exit 1
          fi
          if [ "$SCOPE" = smoke ]; then
            branches=("$FAMILY")
          else
            branches=("${supported_families[@]}")
          fi
          susfs_commits='{}'
          for branch in "${branches[@]}"; do
            branch_head="$(git ls-remote --exit-code --heads https://gitlab.com/simonpunk/susfs4ksu.git "refs/heads/gki-${branch}" | cut -f1)" || {
              echo "Missing official SUSFS branch: gki-${branch}; refusing unpatched build." >&2
              exit 1
            }
            if ! [[ "$branch_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid SUSFS revision for gki-${branch}: ${branch_head}" >&2
              exit 1
            fi
            susfs_commits="$(jq -cn --argjson commits "$susfs_commits" --arg family "$branch" --arg sha "$branch_head" '$commits + {($family): $sha}')"
          done
          if [ "$SCOPE" = full ]; then
            smoke_asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${smoke_release_id}/assets?per_page=100" |
              jq -er '[.[] | select(.name | endswith("-KSUN-v3.4.2-SUSFS.zip"))] |
                if length == 1 then .[0].id else error("Missing unique smoke ZIP") end')"
            smoke_zip="${RUNNER_TEMP}/susfs-smoke-${SMOKE_RUN_ID}.zip"
            curl -fLsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/octet-stream' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/${smoke_asset_id}" -o "$smoke_zip"
            unzip -tqq "$smoke_zip" >/dev/null
            unzip -p "$smoke_zip" SOURCE.json |
              jq -e --argjson commits "$susfs_commits" '
                .susfs == true and (.kernel.kmi | type == "string") and
                .susfs_revision == $commits[.kernel.kmi]' >/dev/null || {
                  echo 'Smoke SUSFS revision differs from the current family pin; rerun smoke before full.' >&2
                  exit 1
                }
          fi
          echo "expected_count=$count" >> "$GITHUB_OUTPUT"
          echo "susfs_commits=$susfs_commits" >> "$GITHUB_OUTPUT"
          echo "Selected ${count} SUSFS Normal target(s); kernel 6.18 is excluded until a verified SUSFS port exists."

  build-android12-5-10:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android12-5.10'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android12-5.10.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android12-5.10'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android13-5-10:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android13-5.10'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android13-5.10.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android13-5.10'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android13-5-15:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android13-5.15'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android13-5.15.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android13-5.15'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android14-5-15:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android14-5.15'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-5.15.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android14-5.15'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android14-6-1:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android14-6.1'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-6.1.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android14-6.1'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android15-6-6:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android15-6.6'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android15-6.6.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android15-6.6'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  build-android16-6-12:
    needs: preflight
    if: inputs.scope == 'full' || inputs.family == 'android16-6.12'
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android16-6.12.json
      os_patch_level: ${{ inputs.scope == 'full' && 'All' || inputs.patch_level }}
      root_flavor: next
      root_commit: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      root_source: pershoot-susfs
      feature_set: SUSFS
      susfs_commit: ${{ fromJSON(needs.preflight.outputs.susfs_commits)['android16-6.12'] }}
      variant: Normal
      brand_name: KernelSU-Next
      use_cache: false

  release:
    needs:
      - preflight
      - build-android12-5-10
      - build-android13-5-10
      - build-android13-5-15
      - build-android14-5-15
      - build-android14-6-1
      - build-android15-6-6
      - build-android16-6-12
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SCOPE: ${{ inputs.scope }}
      FAMILY: ${{ inputs.family }}
      PATCH_LEVEL: ${{ inputs.patch_level }}
      EXPECTED_COUNT: ${{ needs.preflight.outputs.expected_count }}
      SUSFS_COMMITS: ${{ needs.preflight.outputs.susfs_commits }}
      ROOT_SHA: d21e0a66c887ae4bc75b7c9f83e41761819ec09a
      MANAGER_SOURCE_SHA: 4c706b5938665866ebe16944a481a7b91e3396af
    steps:
      - uses: actions/checkout@v7
      - name: Download, validate, and package every expected GKI artifact
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/ksun-v3.4.2-susfs"
          mkdir -p "$work/assets" "$work/stage"
          targets="$work/targets.jsonl"
          : > "$targets"
          for config in .github/config/android{12-5.10,13-5.10,13-5.15,14-5.15,14-6.1,15-6.6,16-6.12}.json; do
            jq -c --arg scope "$SCOPE" --arg family "$FAMILY" --arg date "$PATCH_LEVEL" '
              .version as $version | .include[] |
              select($scope == "full" or ($version == $family and .date == $date)) |
              {family: $version, sublevel: .sublevel, date: .date}
            ' "$config" >> "$targets"
          done
          test "$(wc -l < "$targets")" -eq "$EXPECTED_COUNT"

          inventory_lines="$work/inventory.jsonl"
          : > "$inventory_lines"
          for page in $(seq 1 20); do
            batch="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100&page=${page}")"
            jq -c '.artifacts[] | {id, name, expired}' <<< "$batch" >> "$inventory_lines"
            if [ "$(jq '.artifacts | length' <<< "$batch")" -lt 100 ]; then break; fi
            if [ "$page" -eq 20 ]; then echo 'Artifact inventory exceeded 2000; refusing partial release.' >&2; exit 1; fi
          done
          jq -s . "$inventory_lines" > "$work/inventory.json"
          matched="$work/matched-artifacts.txt"
          : > "$matched"
          expected_names="$work/expected-names.txt"
          : > "$expected_names"
          : > "$work/SHA256SUMS.txt"
          tag="ksun-next-v3.4.2-susfs-${SCOPE}-${GITHUB_RUN_ID}"
          printf 'KernelSU Next SUSFS kernel + official v3.4.2 managers (%s, %s Normal GKI targets)\n\nRoot source: https://github.com/pershoot/KernelSU-Next (commit %s)\nGitHub Actions run: %s/%s/actions/runs/%s\n\nSUSFS: enabled; each ZIP records its own resolved SUSFS revision in SOURCE.json and BuildInfo. NoMount: disabled. Android 17 / kernel 6.18 is excluded: upstream SUSFS has no verified gki-android17-6.18 branch. Each ZIP contains an Image checksum; see SHA256SUMS.txt for ZIP checksums. Device bootability is not validated.\n' \
            "$SCOPE" "$EXPECTED_COUNT" "$ROOT_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$work/release-notes.md"
          printf '\nStandalone manager APKs: official KernelSU-Next v3.4.2 release (tag v3.4.2, source commit %s). Both normal and spoofed APKs are separate assets, not embedded in the AK3 ZIPs. See MANAGER-SHA256SUMS.txt for their pinned SHA-256 checksums.\n' \
            "$MANAGER_SOURCE_SHA" >> "$work/release-notes.md"
          printf 'Official manager source: https://github.com/KernelSU-Next/KernelSU-Next/releases/tag/v3.4.2 (upstream repository license: GPL-3.0). Both APKs are redistributed unchanged.\n' >> "$work/release-notes.md"
          release_matches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -cs --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]')"
          if [ "$(jq 'length' <<< "$release_matches")" -gt 1 ]; then
            echo "Multiple releases match ${tag}; refusing to upload." >&2
            exit 1
          fi
          if [ "$(jq 'length' <<< "$release_matches")" -eq 1 ]; then
            jq -e --arg sha "$GITHUB_SHA" '.[0] | .draft == true and .target_commitish == $sha' \
              <<< "$release_matches" >/dev/null || {
                echo "Refusing to modify a published or mismatched release: ${tag}." >&2
                exit 1
              }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "KernelSU Next v3.4.2 SUSFS GKI AK3 (${SCOPE})" --notes-file "$work/release-notes.md"
          fi

          while IFS= read -r target; do
            family="$(jq -r .family <<< "$target")"
            sublevel="$(jq -r .sublevel <<< "$target")"
            date="$(jq -r .date <<< "$target")"
            android="${family%%-*}"
            kver="${family#*-}"
            if [ "$sublevel" = X ]; then
              # LTS sublevel comes from the checked-out kernel Makefile at build time.
              mapfile -t matches < <(jq -r --arg prefix "${kver}." --arg suffix "-${android}-lts-AnyKernel3" \
                '.[] | select(.expired == false and (.name | startswith($prefix) and endswith($suffix))) | [.id, .name] | @tsv' "$work/inventory.json")
            else
              wanted="${kver}.${sublevel}-${android}-${date}-AnyKernel3"
              mapfile -t matches < <(jq -r --arg wanted "$wanted" \
                '.[] | select(.expired == false and .name == $wanted) | [.id, .name] | @tsv' "$work/inventory.json")
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected one AK3 artifact for ${family} ${date} (sublevel ${sublevel}), got ${#matches[@]}." >&2
              exit 1
            fi
            IFS=$'\t' read -r artifact_id artifact_name <<< "${matches[0]}"
            info_name="${artifact_name%-AnyKernel3}-BuildInfo"
            mapfile -t info < <(jq -r --arg wanted "$info_name" \
              '.[] | select(.expired == false and .name == $wanted) | [.id, .name] | @tsv' "$work/inventory.json")
            if [ "${#info[@]}" -ne 1 ]; then
              echo "Missing exactly one BuildInfo for ${artifact_name}." >&2
              exit 1
            fi
            IFS=$'\t' read -r info_id _ <<< "${info[0]}"
            printf '%s\n' "$artifact_name" >> "$matched"

            curl -fLsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$work/artifact.zip"
            curl -fLsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${info_id}/zip" -o "$work/info.zip"
            unzip -tqq "$work/artifact.zip" >/dev/null
            unzip -tqq "$work/info.zip" >/dev/null
            unzip -q "$work/artifact.zip" -d "$work/stage"
            unzip -q "$work/info.zip" -d "$work/stage-info"
            image="$work/stage/Image"
            script="$work/stage/anykernel.sh"
            if [ ! -s "$image" ] || [ ! -s "$script" ]; then
              echo "AK3 requires nonempty root-level Image and anykernel.sh: ${artifact_name}" >&2
              exit 1
            fi
            if [ "$(od -An -tx1 -j56 -N4 "$image" | tr -d ' \n')" != 41524d64 ]; then
              echo "Image lacks ARM64 Linux Image magic: ${artifact_name}" >&2
              exit 1
            fi
            mapfile -t summaries < <(find "$work/stage-info" -maxdepth 1 -name 'build-summary-*.md' -type f)
            if [ "${#summaries[@]}" -ne 1 ]; then echo "Invalid BuildInfo for ${artifact_name}" >&2; exit 1; fi
            awk '/^```json$/{inside=1;next} inside && /^```$/{exit} inside{print}' "${summaries[0]}" > "$work/metadata.json"
            jq -e --arg sha "$ROOT_SHA" --arg family "$family" --arg branch "${family}-${date}" --argjson commits "$SUSFS_COMMITS" '
              .status == "Build-verified only" and
              .root.implementation == "next" and .root.commit == $sha and
              .root.repository == "https://github.com/pershoot/KernelSU-Next.git" and
              .kmi == $family and .android_branch == $branch and
              (.susfs_revision | test("^[0-9a-f]{40}$")) and
              .susfs_revision == $commits[$family] and
              (.susfs_config_sha256 | test("^[0-9a-f]{64}$")) and
              (.method | contains("SUSFS")) and .nomount_commit == "N/A" and
              (.kernel_source_commit | test("^[0-9a-f]{40}$"))
            ' "$work/metadata.json" >/dev/null
            jq -n --slurpfile meta "$work/metadata.json" \
              --arg root "$ROOT_SHA" --arg manager_commit "$MANAGER_SOURCE_SHA" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
              --arg image_sha "$(sha256sum "$image" | cut -d' ' -f1)" \
              --arg anykernel_sha "$(sha256sum "$script" | cut -d' ' -f1)" \
              '{kernel_su_next: {version: $meta[0].root.version, commit: $root, repository: "pershoot/KernelSU-Next"},
                manager: {version: "v3.4.2", commit: $manager_commit,
                          repository: "KernelSU-Next/KernelSU-Next"},
                kernel: {kmi: $meta[0].kmi, android_branch: $meta[0].android_branch,
                         source_commit: $meta[0].kernel_source_commit, image_sha256: $image_sha},
                anykernel_sh_sha256: $anykernel_sha, susfs: true,
                susfs_revision: $meta[0].susfs_revision,
                susfs_config_sha256: $meta[0].susfs_config_sha256,
                workflow: {repository: $repo, commit: $workflow_sha, run_id: $run},
                build_info: $meta[0]}' > "$work/stage/SOURCE.json"
            asset_name="${artifact_name%-AnyKernel3}-KSUN-v3.4.2-SUSFS.zip"
            (cd "$work/stage" && zip -q -r -9 "$work/assets/$asset_name" .)
            unzip -tqq "$work/assets/$asset_name" >/dev/null
            (cd "$work/assets" && sha256sum "$asset_name" >> "$work/SHA256SUMS.txt")
            printf '%s\n' "$asset_name" >> "$expected_names"
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$work/assets/$asset_name" --clobber; then
                uploaded=true
                break
              fi
              sleep 10
            done
            if [ "$uploaded" != true ]; then
              echo "Release upload failed: $asset_name. Draft kept unpublished." >&2
              exit 1
            fi
            rm -f "$work/assets/$asset_name"
            rm -rf "$work/stage" "$work/stage-info" "$work/artifact.zip" "$work/info.zip" "$work/metadata.json"
            mkdir -p "$work/stage"
          done < "$targets"
          if [ "$(sort -u "$matched" | wc -l)" -ne "$EXPECTED_COUNT" ] ||
             [ "$(sort -u "$expected_names" | wc -l)" -ne "$EXPECTED_COUNT" ] ||
             [ "$(wc -l < "$work/SHA256SUMS.txt")" -ne "$EXPECTED_COUNT" ]; then
            echo 'Artifact count or uniqueness mismatch; refusing release.' >&2
            exit 1
          fi
          awk '{print $2}' "$work/SHA256SUMS.txt" | sort > "$work/checksummed-names.txt"
          sort "$expected_names" > "$work/expected-zips-sorted.txt"
          cmp "$work/checksummed-names.txt" "$work/expected-zips-sorted.txt"
          echo "Validated and uploaded ${EXPECTED_COUNT} ARM64 Images, AK3 scripts, matching build metadata, and SHA manifests to an unpublished draft."

      - name: Verify and upload official v3.4.2 manager APKs to draft
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/ksun-v3.4.2-susfs"
          tag="ksun-next-v3.4.2-susfs-${SCOPE}-${GITHUB_RUN_ID}"
          upstream="KernelSU-Next/KernelSU-Next"
          normal="KernelSU_Next_v3.4.2_33355-release.apk"
          spoofed="KernelSU_Next_v3.4.2-spoofed_33355-release.apk"
          normal_sha="774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58"
          spoofed_sha="e27ad21204e8f58a4268c41725de97341c62a2f4acca7fa4dda256e9d7863d01"
          tag_sha="$(git ls-remote "https://github.com/${upstream}.git" \
            'refs/tags/v3.4.2' 'refs/tags/v3.4.2^{}' |
            awk '$2 == "refs/tags/v3.4.2^{}" {peeled=$1} $2 == "refs/tags/v3.4.2" {direct=$1} END {print peeled ? peeled : direct}')"
          if [ "$tag_sha" != "$MANAGER_SOURCE_SHA" ]; then
            echo "Official manager tag is not the pinned manager source commit: ${tag_sha}" >&2
            exit 1
          fi
          upstream_release="$(gh api "repos/${upstream}/releases/tags/v3.4.2")"
          jq -e --arg normal "$normal" --arg spoofed "$spoofed" \
            --arg normal_sha "$normal_sha" --arg spoofed_sha "$spoofed_sha" '
            .tag_name == "v3.4.2" and .draft == false and
            ([.assets[] | select(.name == $normal or .name == $spoofed)] | length == 2) and
            all(.assets[] | select(.name == $normal or .name == $spoofed);
              .state == "uploaded" and .size > 0 and
              .digest == ("sha256:" + (if .name == $normal then $normal_sha else $spoofed_sha end)))
          ' <<< "$upstream_release" >/dev/null
          : > "$work/MANAGER-SHA256SUMS.txt"
          for spec in "$normal:$normal_sha" "$spoofed:$spoofed_sha"; do
            name="${spec%%:*}"
            expected_sha="${spec#*:}"
            url="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' <<< "$upstream_release")"
            if [ "$url" != "https://github.com/${upstream}/releases/download/v3.4.2/${name}" ]; then
              echo "Unexpected official APK download URL: ${name}" >&2
              exit 1
            fi
            curl -fLsS --retry 3 --retry-all-errors "$url" -o "$work/assets/$name"
            test -s "$work/assets/$name"
            upstream_size="$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .size' <<< "$upstream_release")"
            if [ "$(stat -c %s "$work/assets/$name")" -ne "$upstream_size" ]; then
              echo "Official APK size mismatch: ${name}" >&2
              exit 1
            fi
            unzip -tqq "$work/assets/$name" >/dev/null
            actual_sha="$(sha256sum "$work/assets/$name" | cut -d' ' -f1)"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Official APK SHA-256 mismatch: ${name}" >&2
              exit 1
            fi
            printf '%s  %s\n' "$actual_sha" "$name" >> "$work/MANAGER-SHA256SUMS.txt"
          done
          test "$(wc -l < "$work/MANAGER-SHA256SUMS.txt")" -eq 2
          for name in "$normal" "$spoofed"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$work/assets/$name" --clobber; then
                uploaded=true
                break
              fi
              sleep 10
            done
            if [ "$uploaded" != true ]; then
              echo "Manager upload failed: $name. Draft kept unpublished." >&2
              exit 1
            fi
            printf '%s\n' "$name" >> "$work/expected-names.txt"
          done
          echo 'Validated and uploaded both pinned official manager APKs to the unpublished draft.'

      - name: Publish release only after complete verification
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/ksun-v3.4.2-susfs"
          tag="ksun-next-v3.4.2-susfs-${SCOPE}-${GITHUB_RUN_ID}"
          test "$(wc -l < "$work/SHA256SUMS.txt")" -eq "$EXPECTED_COUNT"
          test "$(wc -l < "$work/MANAGER-SHA256SUMS.txt")" -eq 2
          for manifest in SHA256SUMS.txt MANAGER-SHA256SUMS.txt; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$work/$manifest" --clobber; then
                uploaded=true
                break
              fi
              sleep 10
            done
            if [ "$uploaded" != true ]; then
              echo "Checksum upload failed: $manifest. Draft kept unpublished." >&2
              exit 1
            fi
            printf '%s\n' "$manifest" >> "$work/expected-names.txt"
          done
          sort "$work/expected-names.txt" > "$work/expected-sorted.txt"
          {
            cat "$work/SHA256SUMS.txt" "$work/MANAGER-SHA256SUMS.txt"
            (cd "$work" && sha256sum SHA256SUMS.txt MANAGER-SHA256SUMS.txt)
          } | awk '{print $2 "\tsha256:" $1}' | sort > "$work/expected-digests-sorted.txt"
          test "$(wc -l < "$work/expected-digests-sorted.txt")" -eq "$((EXPECTED_COUNT + 4))"
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -ers --arg tag "$tag" --arg sha "$GITHUB_SHA" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 1 and .[0].draft == true and .[0].target_commitish == $sha
              then .[0].id else error("Missing or mismatched draft release") end')"
          for attempt in $(seq 1 10); do
            : > "$work/remote-assets.jsonl"
            rm -f "$work/remote-sorted.txt" "$work/remote-digests-sorted.txt"
            for page in $(seq 1 10); do
              batch="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100&page=${page}")"
              jq -c '.[] | {name, size, state, digest}' <<< "$batch" >> "$work/remote-assets.jsonl"
              if [ "$(jq 'length' <<< "$batch")" -lt 100 ]; then break; fi
              if [ "$page" -eq 10 ]; then echo 'Release has too many assets.' >&2; exit 1; fi
            done
            if jq -s -e --argjson want "$((EXPECTED_COUNT + 4))" \
              'length == $want and all(.[]; .size > 0 and .state == "uploaded" and ((.digest // "") | startswith("sha256:")))' \
              "$work/remote-assets.jsonl" >/dev/null; then
              jq -r .name "$work/remote-assets.jsonl" | sort > "$work/remote-sorted.txt"
              jq -r '[.name, .digest] | @tsv' "$work/remote-assets.jsonl" | sort > "$work/remote-digests-sorted.txt"
            fi
            if [ -f "$work/remote-sorted.txt" ] &&
               [ -f "$work/remote-digests-sorted.txt" ] &&
               cmp -s "$work/expected-sorted.txt" "$work/remote-sorted.txt" &&
               cmp -s "$work/expected-digests-sorted.txt" "$work/remote-digests-sorted.txt"; then break; fi
            if [ "$attempt" -eq 10 ]; then echo 'Incomplete or mismatched draft release assets.' >&2; exit 1; fi
            sleep 5
          done
          if [ "$SCOPE" = smoke ]; then
            echo "Smoke assets verified in unpublished draft ${tag}; no individual ZIP was published."
          else
            gh release edit "$tag" --draft=false
            gh release view "$tag" --json url,isDraft |
              jq -e 'select(.isDraft == false) | .url'
          fi

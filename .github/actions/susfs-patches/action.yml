name: 'Apply SUSFS Patches'
description: 'Copy base SUSFS patches and apply version-specific fake patches'
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        # Apply base SUSFS patches
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/fs/"* "${{ github.workspace }}/kernel/common/fs/"
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/"* "${{ github.workspace }}/kernel/common/include/linux/"
        cp ${{ github.workspace }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.version }}.patch ./

    - name: Apply Android 12 5.10 Fake Patches
      shell: bash
      if: inputs.version == 'android12-5.10'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.sublevel }}" -le "43" ]; then
          echo "Applying base.c Android 12 5.10 Fake Patch"
          perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/;' fs/proc/base.c
        fi
        if [ "${{ inputs.sublevel }}" -le "117" ]; then
          echo "Applying fdinfo.c Android 12 5.10 Fake Patch"
          perl -0777 -i -pe 's{(if \(inode\) \{\n)\t\t/\*\n(\t\t \*[^\n]*\n)+\t\t \*/\n}{$1}g; s{^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;\n}{}m' fs/notify/fdinfo.c
          perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
          perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          echo "Adding inotify_mark_user_mask function definition"
          python3 -c 'import re;c=open("fs/notify/fdinfo.c").read();c=re.sub(r"^static void inotify_fdinfo\(struct seq_file \*m, struct fsnotify_mark \*mark\)$",lambda m:"static inline u32 inotify_mark_user_mask(struct fsnotify_mark *mark)\n{\n\treturn mark->mask & IN_ALL_EVENTS;\n}\n\n"+m.group(0),c,count=1,flags=re.MULTILINE);open("fs/notify/fdinfo.c","w").write(c)'
        fi

    - name: Apply Android 13 5.10 Fake Patches
      shell: bash
      if: inputs.version == 'android13-5.10'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        echo "Applying Android 13 5.10 SUSFS fixes"
        if [ "${{ inputs.sublevel }}" -le "107" ]; then
          echo "Applying fdinfo.c Android 13 5.10 Fake Patch"
          perl -0777 -i -pe 's{(if \(inode\) \{\n)\t\t/\*\n(\t\t \*[^\n]*\n)+\t\t \*/\n}{$1}g; s{^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;\n}{}m' fs/notify/fdinfo.c
          perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
          perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          echo "Adding inotify_mark_user_mask function definition"
          python3 -c 'import re;c=open("fs/notify/fdinfo.c").read();c=re.sub(r"^static void inotify_fdinfo\(struct seq_file \*m, struct fsnotify_mark \*mark\)$",lambda m:"static inline u32 inotify_mark_user_mask(struct fsnotify_mark *mark)\n{\n\treturn mark->mask & IN_ALL_EVENTS;\n}\n\n"+m.group(0),c,count=1,flags=re.MULTILINE);open("fs/notify/fdinfo.c","w").write(c)'
        fi

    - name: Apply Android 13 5.15 Fake Patches
      shell: bash
      if: inputs.version == 'android13-5.15'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        echo "Applying Android 13 5.15 SUSFS fixes"
        if [ "${{ inputs.sublevel }}" -le "41" ]; then
          echo "Applying namespace.c Android 13 5.15 SUSFS fixes"
          sed -i '/^#include <linux\/shmem_fs.h>$/a #include <linux/mnt_idmapping.h>' fs/namespace.c
          echo "Applying open.c Android 13 5.15 Fake Patch"
          sed -i '/^#include <linux\/compat.h>$/a #include <linux/mnt_idmapping.h>' fs/open.c
          echo "Applying fdinfo.c Android 13 5.15 Fake Patch"
          perl -0777 -i -pe 's{(if \(inode\) \{\n)\t\t/\*\n(\t\t \*[^\n]*\n)+\t\t \*/\n}{$1}g; s{^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;\n}{}m' fs/notify/fdinfo.c
          perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
          perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          echo "Adding inotify_mark_user_mask function definition"
          python3 -c 'import re;c=open("fs/notify/fdinfo.c").read();c=re.sub(r"^static void inotify_fdinfo\(struct seq_file \*m, struct fsnotify_mark \*mark\)$",lambda m:"static inline u32 inotify_mark_user_mask(struct fsnotify_mark *mark)\n{\n\treturn mark->mask & IN_ALL_EVENTS;\n}\n\n"+m.group(0),c,count=1,flags=re.MULTILINE);open("fs/notify/fdinfo.c","w").write(c)'
        fi
        # The pinned 5.15 SUSFS patch expects these hooks as exact context,
        # although several stock GKI revisions omit one or both headers.
        # Inject missing lines temporarily; restore their original absence
        # after patching so old kernels do not include unavailable headers.
        if ! grep -Fxq '#include <trace/hooks/blk.h>' fs/namespace.c; then
          grep -Fxq '#include "internal.h"' fs/namespace.c || { echo 'Missing namespace.c include anchor' >&2; exit 1; }
          sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
          echo 'SUSFS_5_15_SYNTHETIC_BLK=1' >> "$GITHUB_ENV"
        fi
        if ! grep -Fxq '#include <trace/hooks/mm.h>' fs/proc/task_mmu.c; then
          grep -Fxq '#include <linux/pkeys.h>' fs/proc/task_mmu.c || { echo 'Missing task_mmu.c include anchor' >&2; exit 1; }
          sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
          echo 'SUSFS_5_15_SYNTHETIC_MM=1' >> "$GITHUB_ENV"
        fi

    - name: Apply Android 14 6.1 Fake Patches
      shell: bash
      if: inputs.version == 'android14-6.1'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.sublevel }}" -le "25" ]; then
          echo "Applying base.c Android 14 6.1 Fake Patch"
          sed -i '/^#include <trace\/events\/oom.h>$/a #include <trace/hooks/sched.h>' fs/proc/base.c
        fi
        if [ "${{ inputs.sublevel }}" -le "141" ]; then
          echo "Applying base.c Android 14 6.1 Fake Patch"
          sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
        fi

        # Match the pinned 6.1 SUSFS namespace hunk on older stock trees.
        # Restore the original absence of this context-only header after patching.
        if ! grep -Fxq '#include <trace/hooks/blk.h>' fs/namespace.c; then
          grep -Fxq '#include "internal.h"' fs/namespace.c || { echo 'Missing namespace.c include anchor' >&2; exit 1; }
          sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
          echo 'SUSFS_6_1_SYNTHETIC_BLK=1' >> "$GITHUB_ENV"
        fi

    - name: Apply Android 15 6.6 Fake Patches
      shell: bash
      if: inputs.version == 'android15-6.6'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        echo "Applying 6.6 SUSFS fixes"
        if [ "${{ inputs.sublevel }}" -le "30" ]; then
          echo "Applying taskmmu.c Android 15 6.6 Fake Patch"
          python3 -c 'import re;c=open("fs/proc/task_mmu.c").read();c=re.sub(r"(\t+\t\tif\s*\(\s*vma->vm_end\s*>\s*last_vma_end\s*\))\n(\t+\t\t\tsmap_gather_stats\(vma,\s*&mss,\s*last_vma_end\);)\n(\t+)\}",lambda m:m.group(1)+" {\n"+m.group(2)+"\n"+m.group(3)+"\t\tlast_vma_end = vma->vm_end;\n"+m.group(3)+"\t}\n"+m.group(3)+"}",c,count=1);open("fs/proc/task_mmu.c","w").write(c)'
        fi
        if [ "${{ inputs.sublevel }}" -le "30" ] && [ "${{ inputs.os_patch_level }}" = "2024-07" ]; then
          echo "Adding __fold_filemap_fixup_entry stub for 2024-07 kernels"
          sed -i '/^#include <asm\/elf.h>$/i #ifndef __fold_filemap_fixup_entry\nstatic inline void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end) { }\n#endif /* __fold_filemap_fixup_entry */\n' fs/proc/task_mmu.c
        fi
        if [ "${{ inputs.sublevel }}" -le "92" ]; then
          echo "Applying base.c Android 15 6.6 Fake Patch"
          sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' fs/proc/base.c
        fi
        if [ "${{ inputs.sublevel }}" -le "57" ]; then
          echo "Applying base.c Android 15 6.6 Fake Patch"
          sed -i '/^#include <linux\/sched\/sysctl.h>$/a #include <linux/zswap.h>' mm/memory.c
        fi

    - name: Apply Android 16 6.12 Fake Patches
      shell: bash
      if: inputs.version == 'android16-6.12'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        echo "Applying 6.12 SUSFS fixes"
        if [ "${{ inputs.sublevel }}" -ge "58" ] && [ "${{ inputs.sublevel }}" -lt "92" ]; then
          echo "Applying exec.c Android 16 6.12 Fake Patch"
          sed -i '/^#include <linux\/dma-buf.h>$/d' fs/exec.c
        fi
        if [ "${{ inputs.sublevel }}" -ge "69" ] && [ "${{ inputs.sublevel }}" -lt "92" ]; then
          echo "Applying task_mmu.c Android 16 6.12 Fake Patch"
          sed -i 's/vma_data_pages/vma_pages/g' fs/proc/task_mmu.c
        fi
        # Native 6.12.92 already matches the pinned SUSFS patch context.
        # Do not rewrite exec.c or task_mmu.c for sublevel 92+.

    - name: Apply Kernel SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.version }}" = "android16-6.12" ]; then
          python3 - --source-root . --patch "50_add_susfs_in_gki-${{ inputs.version }}.patch" <<'PY'
        #!/usr/bin/env python3
        """Adapt only known SUSFS 6.12 patch hunks to older GKI smaps layouts.

        Run before applying the SUSFS patch. Kernel source is read, never modified.
        Unknown patch hunks or source layouts stop without writing the patch.
        """
        from pathlib import Path
        import argparse
        import difflib
        import re


        def fail(message):
            raise SystemExit('SUSFS 6.12 adaptation refused: ' + message)


        def section(patch, name):
            marker = f'diff --git a/{name} b/{name}\n'
            if patch.count(marker) != 1:
                fail(f'expected one {name} patch section')
            start = patch.index(marker)
            end = patch.find('\ndiff --git ', start + len(marker))
            if end < 0:
                end = len(patch)
            else:
                end += 1
            return start, end, patch[start:end]


        def hunks(text):
            starts = [m.start() for m in re.finditer(r'^@@ ', text, re.M)]
            return [(start, starts[i + 1] if i + 1 < len(starts) else len(text),
                     text[start:starts[i + 1] if i + 1 < len(starts) else len(text)])
                    for i, start in enumerate(starts)]


        def generated_hunks(before, after):
            lines = list(difflib.unified_diff(before.splitlines(True), after.splitlines(True),
                                             fromfile='source', tofile='adapted', n=3))
            if len(lines) < 3:
                fail('expected source-layout adaptation changes')
            return ''.join(lines[2:])


        def old_function(source, signature):
            if source.count(signature) != 1:
                fail('expected one function ' + signature)
            start = source.index(signature)
            end = source.find('\n}\n', start)
            if end < 0:
                fail('unterminated function ' + signature)
            return start, end + 3, source[start:end + 3]


        def adapt(root, patch):
            edits = []
            exec_source = (root / 'fs/exec.c').read_text(encoding='utf-8')
            start, end, part = section(patch, 'fs/exec.c')
            hs = hunks(part)
            if not hs or '#include <linux/dma-buf.h>\n' not in hs[0][2]:
                fail('unexpected exec.c include hunk')
            if '#include <linux/dma-buf.h>\n' not in exec_source:
                anchor = '#include <linux/rseq.h>\n#include <linux/ksm.h>\n\n#include <linux/uaccess.h>\n#include <asm/mmu_context.h>\n'
                if exec_source.count(anchor) != 1:
                    fail('unknown exec.c include layout')
                if hs[0][2].count('+#ifdef CONFIG_KSU_SUSFS\n+#include <linux/susfs_def.h>\n+#endif\n') != 1:
                    fail('unexpected exec.c include payload')
                after = exec_source.replace(anchor, anchor.replace('\n\n#include <linux/uaccess.h>',
                    '\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n\n#include <linux/uaccess.h>'), 1)
                a, b, _ = hs[0]
                edits.append((start, end, part[:a] + generated_hunks(exec_source, after) + part[b:]))

            source = (root / 'fs/proc/task_mmu.c').read_text(encoding='utf-8')
            start, end, part = section(patch, 'fs/proc/task_mmu.c')
            hs = hunks(part)
            selected = [(a,b,h) for a,b,h in hs if 'static int show_smap(' in h.splitlines()[0]
                        or 'static int show_smaps_rollup(' in h.splitlines()[0]]
            if len(selected) != 3:
                fail('expected exactly three smaps patch hunks')
            if selected[0][2].count(' \tif (!vma_data_pages(vma))\n') != 1:
                fail('unexpected show_smap patch context')
            if (' \t\t\tgoto out_unlock;\n' not in selected[1][2] or
                ' \t\t\tsmap_gather_stats(priv, vma, &mss);\n' not in selected[2][2]):
                fail('unexpected show_smaps_rollup patch context')
            a,b,show = old_function(source, 'static int show_smap(struct seq_file *m, void *v)\n')
            c,d,roll = old_function(source, 'static int show_smaps_rollup(struct seq_file *m, void *v)\n')
            # Newer layouts already match the pinned SUSFS patch; preserve them untouched.
            if 'smap_gather_stats(priv, vma, &mss)' in roll:
                if 'if (!vma_data_pages(vma))' not in show or 'goto out_unlock;' not in roll:
                    fail('incomplete modern smaps layout')
            else:
                anchor = '\tstruct mem_size_stats mss = {};\n\n\tif (!vma_pages(vma))\n\t\tgoto show_pad;\n'
                if show.count(anchor) != 1:
                    fail('unknown legacy show_smap layout')
                calls = [line for line in roll.splitlines(True) if 'smap_gather_stats(' in line]
                expected = ['\t\tsmap_gather_stats(vma, &mss, 0);\n',
                            '\t\t\t\tsmap_gather_stats(vma, &mss, 0);\n',
                            '\t\t\t\tsmap_gather_stats(vma, &mss, last_vma_end);\n']
                if calls != expected or roll.count('\t} for_each_vma(vmi, vma);\n') != 1:
                    fail('unknown legacy show_smaps_rollup layout')
                if 'SUSFS_IS_INODE_SUS_MAP' in show + roll:
                    fail('smaps source already contains SUSFS guards')
                guard = ('#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
                         '\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n'
                         '\t\treturn 0;\n'
                         '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\n')
                fixed_show = show.replace(anchor, anchor.replace('\tif (!vma_pages(vma))', guard + '\tif (!vma_pages(vma))'), 1)
                fixed_roll = roll
                for call in calls:
                    indent = call[:len(call) - len(call.lstrip('\t'))]
                    guarded = ('#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n' + indent +
                        'if (!(vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))))\n' +
                        '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n' + indent + '\t' + call.lstrip('\t'))
                    fixed_roll = fixed_roll.replace(call, guarded, 1)
                fixed = source[:a] + fixed_show + source[b:c] + fixed_roll + source[d:]
                first, last = selected[0][0], selected[-1][1]
                edits.append((start, end, part[:first] + generated_hunks(source, fixed) + part[last:]))
            for start, end, replacement in sorted(edits, reverse=True):
                patch = patch[:start] + replacement + patch[end:]
            return patch, len(edits)


        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument('--source-root', type=Path, default=Path('.'))
            parser.add_argument('--patch', type=Path, required=True)
            args = parser.parse_args()
            original = args.patch.read_text(encoding='utf-8')
            updated, changes = adapt(args.source_root, original)
            if updated != original:
                args.patch.write_text(updated, encoding='utf-8', newline='\n')
            print(f'SUSFS 6.12: adapted {changes} known legacy file layout(s)')


        if __name__ == '__main__':
            main()
        PY
        fi

        patch -p1 < 50_add_susfs_in_gki-${{ inputs.version }}.patch

        if [ "${{ inputs.version }}" = "android13-5.15" ]; then
          if [ "${SUSFS_5_15_SYNTHETIC_BLK:-0}" = 1 ] || [ "${{ inputs.sublevel }}" -ge 197 ]; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
          fi
          if [ "${SUSFS_5_15_SYNTHETIC_MM:-0}" = 1 ] || [ "${{ inputs.sublevel }}" -ge 197 ]; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
          fi
        fi

        if [ "${{ inputs.version }}" = "android14-6.1" ] && [ "${SUSFS_6_1_SYNTHETIC_BLK:-0}" = 1 ]; then
          sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
        fi

        # Preserve the original patch context: recent 6.1 trees need these
        # stale hook includes removed only after the SUSFS patch is applied.
        if [ "${{ inputs.version }}" = "android14-6.1" ] && [ "${{ inputs.sublevel }}" -ge "157" ]; then
          sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
          sed -i '/^#include <trace\/hooks\/fs.h>$/,+1 d' fs/super.c
        fi

        # SUSFS's OPEN_REDIRECT code unconditionally calls VMA_PAD_START(), which
        # only exists on GKI branches that carry Google's page-size-migration
        # feature (added to each android version's kernel/common branch at a
        # different, sometime later, os_patch_level). Older os_patch_levels in
        # our build matrix predate it, so fall back to a no-padding definition
        # when the real header/macro isn't present. This is version-agnostic and
        # a no-op wherever the real header already provides it.
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # Same story for __fold_filemap_fixup_entry(), declared in page_size_compat.h.
        #if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
        #  sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
        #  echo "Added page_size_compat.h include to fs/proc/task_mmu.c"
        #fi

        # Fix set_nameidata() calls for 5.10 kernels.
        # The SUSFS patch adds set_nameidata(nd, old_dfd, fake_filename, NULL) with 4 args,
        # but 5.10 kernels only have 3-param set_nameidata(p, dfd, name) - no root param.
        #if [[ "${{ inputs.version }}" == "android12-5.10" || "${{ inputs.version }}" == "android13-5.10" ]]; then
        #  if grep -q 'set_nameidata(nd, old_dfd, fake_filename, NULL)' fs/namei.c; then
        #   echo "Fixing set_nameidata calls for 5.10 (4-arg -> 3-arg)"
        #    sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' fs/namei.c
        #  fi
        #fi

        # Fix getname_flags() arity for 6.12: SUSFS patch emits 3-arg
        # getname_flags(filename, lookup_flags, NULL) but 6.12 fs.h declares
        # only 2-arg getname_flags(const char *, int). Drop the trailing NULL.
        #if [[ "${{ inputs.version }}" == "android16-6.12" ]]; then
        #  if grep -q 'getname_flags(filename, lookup_flags, NULL)' fs/open.c; then
        #    echo "Fixing getname_flags 3-arg -> 2-arg for 6.12"
        #    sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/g' fs/open.c
        #  fi
        #fi
